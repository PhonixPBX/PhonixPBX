; conference room Secret Room <2664>
[conf-2]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Set(LOCAL(tries)=0)
 same => n(ask),Read(PIN,conf-getpin,16,,1,10)
 same => n,GotoIf($["${PIN}" = "0815"]?admin)
 same => n,GotoIf($["${PIN}" = "4711"]?user)
 same => n,Set(LOCAL(tries)=$[${tries} + 1])
 same => n,Playback(conf-invalidpin)
 same => n,GotoIf($[${tries} < 3]?ask)
 same => n,Return()
 same => n(admin),ConfBridge(2664,phonix_bridge,phonix_admin,phonix_admin_menu)
 same => n,Return()
 same => n(user),ConfBridge(2664,phonix_bridge,phonix_user,phonix_menu)
 same => n,Return()

