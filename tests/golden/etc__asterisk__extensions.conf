; ARG1 dialstring, ARG2 voicemail box, ARG3 dial options, ARG4 timeout
[sub-dial]
exten => s,1,GotoIf($["${ARG1}" = ""]?s-NOANSWER,1)
 same => n,Dial(${ARG1},${ARG4},${ARG3})
 same => n,Goto(s-${DIALSTATUS},1)
exten => s-ANSWER,1,Hangup()
exten => s-CANCEL,1,Hangup()
exten => s-BUSY,1,Set(MISSEDCAUSE=busy)
 same => n,GotoIf($["${ARG2}" = ""]?nobox)
 same => n,Answer()
 same => n,VoiceMail(${ARG2}@default,b)
 same => n,Hangup()
 same => n(nobox),Busy(10)
exten => s-NOANSWER,1,Set(MISSEDCAUSE=no-answer)
 same => n,Goto(vm,1)
exten => _s-.,1,Set(MISSEDCAUSE=unavailable)
 same => n,Goto(vm,1)
exten => vm,1,GotoIf($["${ARG2}" = ""]?nobox)
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMail(${ARG2}@default,u)
 same => n,Hangup()
 same => n(nobox),Hangup()

; ARG1 dialstring, ARG2 options, ARG3 timeout
[sub-try]
exten => s,1,Dial(${ARG1},${ARG3},${ARG2})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Return()
 same => n(done),Hangup()

; ARG1 extension that may be forwarded
[sub-checkcf]
exten => s,1,Set(LOCAL(dest)=${DB(CF/${ARG1})})
 same => n,GotoIf($["${dest}" = ""]?ret)
 same => n,GotoIf($["${dest}" = "${CALLERID(num)}"]?ret)
 same => n,GotoIf($[0${CF_HOPS} >= 3]?ret)
 same => n,Set(__CF_HOPS=$[0${CF_HOPS} + 1])
 same => n,GotoIf($[${DIALPLAN_EXISTS(phone-${ARG1},${dest},1)}]?fwd)
 same => n(ret),Return()
 same => n(fwd),StackPop()
 same => n,Goto(phone-${ARG1},${dest},1)

; hangup handler: mail missed calls
[sub-missed-call]
exten => s,1,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${NOTIFY_EMAIL}" = ""]?done)
 same => n,GotoIf($["${VMSTATUS}" = "SUCCESS"]?done)
 same => n,System(/usr/libexec/phonix/notify missed "${NOTIFY_EMAIL}" "${NOTIFY_TARGET}" "${IF($["${MISSEDCAUSE}" = ""]?hung-up:${MISSEDCAUSE})}" "${FILTER(0-9a-zA-Z +._@<>-,${CALLERID(all)})}")
 same => n(done),Return()

