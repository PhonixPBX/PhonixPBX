[global]
type=global
user_agent=PhonixPBX
endpoint_identifier_order=ip,username,anonymous
max_initial_qualify_time=4

[system]
type=system

;
; transports
;
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;
; endpoint used to dial external phones configured as plain SIP URIs
;
[uri-dial]
type=endpoint
context=no-inbound
disallow=all
allow=g722,alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

;
; providers
;
; Example Trunk
[prov-1-reg]
type=registration
transport=transport-udp
outbound_auth=prov-1-auth
server_uri=sip:sip.example.com
client_uri=sip:4930123456@sip.example.com

contact_user=4930123456
expiration=3600
retry_interval=60
forbidden_retry_interval=600
fatal_retry_interval=600
max_retries=10000
line=yes
endpoint=prov-1

[prov-1-auth]
type=auth
auth_type=userpass
username=4930123456
password=trunksecret

[prov-1]
type=aor
contact=sip:sip.example.com

qualify_frequency=60

[prov-1]
type=endpoint
transport=transport-udp
context=prov-host-0-in
disallow=all
allow=alaw,ulaw,g722
outbound_auth=prov-1-auth
aors=prov-1
from_user=4930123456
from_domain=sip.example.com
language=en
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
