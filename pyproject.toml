[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phonix"
version = "1.4.0.dev0"
description = "PhonixPBX - embedded Asterisk PBX appliance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime deps are installed from Alpine apk packages on the appliance
# (see packaging/apk/phonix/APKBUILD). Lower bounds match Alpine 3.24.
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "babel>=2.14",
    "defusedxml>=0.7",
    "cryptography>=42",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
phonix = "phonix.cli:main"

[tool.setuptools.packages.find]
include = ["phonix*"]

[tool.setuptools.package-data]
phonix = [
    "core/migrations/*.ini",
    "core/migrations/*.py",
    "core/migrations/*.mako",
    "core/migrations/versions/*.py",
    "generators/templates/**/*",
    "locale/*/LC_MESSAGES/*.po",
    "generators/data/*",
    "web/templates/**/*",
    "web/static/**/*",
    "web/locale/**/*",
    "legacy/data/*",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["legacy/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell is intended
    "S607",   # partial executable paths resolved via PATH on appliance
    "B008",   # FastAPI Depends() in defaults
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311"]
"phonix/core/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "asterisk: requires a real Asterisk binary (run inside the dev container)",
    "integration: slow end-to-end tests",
]
addopts = "-m 'not asterisk and not integration'"
