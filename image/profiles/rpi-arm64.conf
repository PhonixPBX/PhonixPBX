# Board profile (sourced by image/lib/*.sh) - Raspberry Pi 3B+/4/5/Zero 2 W
ARCH=aarch64
LOADER=rpi
KERNEL_FLAVOR=rpi
# ttyS0: Pi 3/4/Zero 2 W GPIO UART (enable_uart=1), ttyAMA10: Pi 5 debug UART
SERIAL_TTYS="ttyS0 ttyAMA10"
CMDLINE="console=serial0,115200 console=tty1 loglevel=6 panic=10 rootwait"
INITRAMFS_MODULES=modules-rpi.list
CLOCK_SERVICE=swclock
