# Board profile (sourced by image/lib/*.sh) - best effort, BIOS only, SSE2 CPUs
# (Alpine x86 packages use SSE2: no Geode/PC Engines ALIX)
ARCH=x86
LOADER=grub
GRUB_PLATFORMS="i386-pc"
KERNEL_FLAVOR=lts
SERIAL_TTYS="ttyS0"
CMDLINE="console=ttyS0,115200 console=tty0 loglevel=6 panic=10"
INITRAMFS_MODULES=modules-pc.list
CLOCK_SERVICE=hwclock
