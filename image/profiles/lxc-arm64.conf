# Board profile (sourced by image/lib/*.sh) - LXC / Incus system container.
# Same root file system as the appliance (OpenRC as init), but no kernel,
# initramfs, boot loader or A/B slots: the output is a rootfs tarball
# (Proxmox VE CT template, lxc-create -t local) and an Incus image.
ARCH=aarch64
LOADER=none
CONTAINER=1
# Incus/LXD architecture name
INCUS_ARCH=aarch64
# the console menu runs on /dev/console (incus console, lxc-console -t 0,
# pct console with cmode=console) and tty1 (lxc-console, pct console)
SERIAL_TTYS=""
CLOCK_SERVICE=""
# common.packages entries that make no sense in a container
PACKAGES_EXCLUDE="busybox-mdev-openrc kmod"
