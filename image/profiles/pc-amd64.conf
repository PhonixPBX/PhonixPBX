# Board profile (sourced by image/lib/*.sh)
ARCH=x86_64
LOADER=grub
GRUB_PLATFORMS="i386-pc x86_64-efi"
KERNEL_FLAVOR=lts
# serial console(s) that get the console menu (missing ones are ignored)
SERIAL_TTYS="ttyS0"
# kernel command line (the last console= is /dev/console)
CMDLINE="console=ttyS0,115200 console=tty0 loglevel=6 panic=10"
INITRAMFS_MODULES=modules-pc.list
CLOCK_SERVICE=hwclock
