# PhonixPBX boot menu (PHXBOOT:/grub/grub.cfg)
#
# A/B slots: grubenv holds boot_slot (the confirmed slot) and try_slot (an
# update to boot exactly once). The trial is consumed here before booting it;
# if the new system does not confirm itself (phonix healthcheck ->
# priv mark-good), the next boot returns to boot_slot.
set timeout=3
set timeout_style=menu
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

load_env
if [ "${boot_slot}" != "B" ]; then
	set boot_slot=A
fi
set slot="${boot_slot}"
set phonix_trial=0
if [ "${try_slot}" = "A" ]; then
	set slot=A
	set phonix_trial=1
fi
if [ "${try_slot}" = "B" ]; then
	set slot=B
	set phonix_trial=1
fi
if [ "${phonix_trial}" = "1" ]; then
	set try_slot=
	save_env try_slot
	set timeout=1
fi
set default="slot${slot}"
export slot
export phonix_trial

menuentry "PhonixPBX (slot A)" --id slotA {
	set t=0
	if [ "${slot}" = "A" ]; then set t="${phonix_trial}"; fi
	echo "Loading PhonixPBX slot A ..."
	linux /slotA/vmlinuz phonix.slot=A phonix.trial=${t} @CMDLINE@
	initrd /slotA/initramfs
}

menuentry "PhonixPBX (slot B)" --id slotB {
	set t=0
	if [ "${slot}" = "B" ]; then set t="${phonix_trial}"; fi
	echo "Loading PhonixPBX slot B ..."
	linux /slotB/vmlinuz phonix.slot=B phonix.trial=${t} @CMDLINE@
	initrd /slotB/initramfs
}
