# AskoziaPBX boot menu (ASKBOOT:/grub/grub.cfg)
#
# A/B slots: grubenv holds boot_slot (the confirmed slot) and try_slot (an
# update to boot exactly once). The trial is consumed here before booting it;
# if the new system does not confirm itself (askozia healthcheck ->
# priv mark-good), the next boot returns to boot_slot.
set timeout=3
set timeout_style=menu
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

load_env
if [ "${boot_slot}" != "B" ]; then
	set boot_slot=A
fi
set slot="${boot_slot}"
set askozia_trial=0
if [ "${try_slot}" = "A" ]; then
	set slot=A
	set askozia_trial=1
fi
if [ "${try_slot}" = "B" ]; then
	set slot=B
	set askozia_trial=1
fi
if [ "${askozia_trial}" = "1" ]; then
	set try_slot=
	save_env try_slot
	set timeout=1
fi
set default="slot${slot}"
export slot
export askozia_trial

menuentry "AskoziaPBX (slot A)" --id slotA {
	set t=0
	if [ "${slot}" = "A" ]; then set t="${askozia_trial}"; fi
	echo "Loading AskoziaPBX slot A ..."
	linux /slotA/vmlinuz askozia.slot=A askozia.trial=${t} @CMDLINE@
	initrd /slotA/initramfs
}

menuentry "AskoziaPBX (slot B)" --id slotB {
	set t=0
	if [ "${slot}" = "B" ]; then set t="${askozia_trial}"; fi
	echo "Loading AskoziaPBX slot B ..."
	linux /slotB/vmlinuz askozia.slot=B askozia.trial=${t} @CMDLINE@
	initrd /slotB/initramfs
}
