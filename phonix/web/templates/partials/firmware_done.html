<div class="alert alert-success mt-3">
  {{ _("Version <strong>%(version)s</strong> has been installed into the inactive slot.", version=info.version) }}
  <form method="post" action="/system/reboot" class="mt-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="btn btn-success" type="submit" name="action" value="reboot">{{ icon("refresh", "me-1") }}{{ _("Reboot into the new firmware") }}</button>
  </form>
</div>
