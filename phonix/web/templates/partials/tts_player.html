<div id="tts-player-{{ ctx }}">
{% if error %}
  <div class="alert alert-danger mt-3 mb-0" role="alert">{{ error }}</div>
{% else %}
  <audio class="w-100 mt-3" controls autoplay src="{{ src }}" aria-label="{{ _('Listen to the announcement') }}"></audio>
{% endif %}
</div>
