{% extends "base.html" %}
{% block content %}
<div class="row"><div class="col-lg-6">
<form method="post" action="/system/reboot" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="card-body">
    <p>{{ _("Active calls are interrupted.") }}</p>
  </div>
  <div class="card-footer d-flex gap-2">
    <button class="btn btn-primary" type="submit" name="action" value="reboot">{{ icon("refresh") }}{{ _("Reboot") }}</button>
    <button class="btn btn-outline-danger ms-auto" type="submit" name="action" value="shutdown">{{ icon("power") }}{{ _("Shut down") }}</button>
  </div>
</form>
</div></div>
{% endblock %}
