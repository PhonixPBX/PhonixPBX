# PhonixPBX web interface: TLS termination, static files and rate limits in
# front of the FastAPI application (uvicorn on a unix socket).
# Installed as /etc/nginx/http.d/phonix.conf.

# only login attempts (POST) count against the login limit
map $request_method $phonix_login_key {
	POST $binary_remote_addr;
	default "";
}
limit_req_zone $phonix_login_key zone=phonix_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=phonix_api:2m rate=20r/s;
limit_req_status 429;

upstream phonix_web {
	server unix:/run/phonix/web.sock;
	keepalive 8;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# ACME HTTP-01 validation (Let's Encrypt), files written by lego
	location ^~ /.well-known/acme-challenge/ {
		root /run/phonix/acme;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	server_name _;

	ssl_certificate /data/tls/server.crt;
	ssl_certificate_key /data/tls/server.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy same-origin always;

	# firmware bundles and backups are streamed to the application, which
	# writes them to the data partition (not to the RAM backed root fs)
	client_max_body_size 1100m;
	client_body_temp_path /data/tmp/nginx 1 2;
	proxy_request_buffering off;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 900s;
	proxy_send_timeout 900s;

	location / {
		limit_req zone=phonix_api burst=100 nodelay;
		proxy_pass http://phonix_web;
	}

	location = /login {
		limit_req zone=phonix_login burst=10 nodelay;
		proxy_pass http://phonix_web;
	}

	# server-sent events (live log tail): no buffering. An exact match: a
	# prefix location ending in "/" makes nginx answer /status/logs with a 301
	# to /status/logs/, which the application redirects back (loop).
	location = /status/logs/stream {
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
		proxy_pass http://phonix_web;
	}

	location /static/ {
		alias /usr/share/phonix/static/;
		expires 7d;
		access_log off;
	}

	location = /favicon.ico {
		return 301 /static/img/favicon.svg;
		access_log off;
	}
}
