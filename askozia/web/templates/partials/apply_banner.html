{% if dirty %}
<div class="alert alert-warning alert-important mb-0 rounded-0 border-0 askozia-apply" role="alert">
  <div class="container-xl d-flex align-items-center gap-3">
    {{ icon("alert-triangle") }}
    <div class="flex-fill">
      <strong>Pending changes</strong> &mdash; the configuration has been changed
      ({{ dirty | join(", ") }}). Apply to activate.
    </div>
    <form method="post" action="/apply" class="m-0" hx-post="/apply" hx-target="#apply-banner" hx-swap="outerHTML" hx-disable="find button">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-dark" type="submit">
        <span class="spinner-border spinner-border-sm me-2 htmx-indicator" role="status"></span>Apply changes
      </button>
    </form>
  </div>
</div>
{% endif %}
