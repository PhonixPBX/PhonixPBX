name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "image/**"
      - "system/**"
      - "packaging/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTAINER: docker

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pc-amd64, rpi-arm64, pc-x86, lxc-amd64, lxc-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release.sh check "$GITHUB_REF_NAME"
      - name: Signing keys
        env:
          UPDATE_KEY: ${{ secrets.PHONIX_UPDATE_SIGNING_KEY }}
          ABUILD_KEY: ${{ secrets.PHONIX_ABUILD_KEY }}
          ABUILD_PUB: ${{ secrets.PHONIX_ABUILD_KEY_PUB }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$UPDATE_KEY" ]; then
            printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/keys/update-signing.pem"
            echo "PHONIX_UPDATE_SIGNING_KEY=$RUNNER_TEMP/keys/update-signing.pem" >> "$GITHUB_ENV"
          else
            echo "::warning::no PHONIX_UPDATE_SIGNING_KEY secret - using a throwaway key (test build)"
          fi
          if [ -n "$ABUILD_KEY" ]; then
            printf '%s\n' "$ABUILD_KEY" > "$RUNNER_TEMP/keys/phonix-abuild.rsa"
            printf '%s\n' "$ABUILD_PUB" > "$RUNNER_TEMP/keys/phonix-abuild.rsa.pub"
            echo "PHONIX_ABUILD_KEY=$RUNNER_TEMP/keys/phonix-abuild.rsa" >> "$GITHUB_ENV"
          fi
      - name: Build apk and image
        run: image/build.sh ${{ matrix.board }}
      - name: Fix ownership of build output
        run: sudo chown -R "$(id -u):$(id -g)" out image/work image/keys
      - name: Inspect image
        if: ${{ !startsWith(matrix.board, 'lxc-') }}
        run: |
          zstd -d -c out/phonix-*-${{ matrix.board }}.img.zst > disk.img
          sfdisk -d disk.img
          rm disk.img
      - name: Inspect container tarballs
        if: startsWith(matrix.board, 'lxc-')
        run: |
          suffix=${BOARD#lxc-}
          tar -tvJf out/phonix-*-"$BOARD".tar.xz > rootfs.lst
          grep -E ' \./(sbin/init|etc/phonix/board|usr/bin/doas|var/spool/asterisk)( |$)' rootfs.lst
          grep -q ' 200/102 .* \./etc/asterisk/$' rootfs.lst
          if grep -E ' \./(boot/.+|lib/modules/.+)' rootfs.lst; then echo "kernel files in a container image"; exit 1; fi
          tar -xJOf out/phonix-*-"$BOARD".tar.xz ./etc/phonix/board | grep -qx "$BOARD"
          tar -tJf out/phonix-*-incus-"$suffix".tar.xz | grep -E '^(metadata.yaml|templates/|rootfs/sbin/init)$'
          tar -xJOf out/phonix-*-incus-"$suffix".tar.xz metadata.yaml
          tar -tvJf out/phonix-*-"$BOARD".meta.tar.xz
          rm rootfs.lst
        env:
          BOARD: ${{ matrix.board }}
      - name: Boot test of the rootfs as a system container (docker)
        if: matrix.board == 'lxc-amd64'
        run: CONTAINER=docker image/test-lxc.sh out/phonix-*-lxc-amd64.tar.xz
      - name: Enable KVM
        if: matrix.board == 'pc-amd64' || matrix.board == 'pc-x86'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf
      - name: QEMU boot smoke test (UEFI + BIOS, update + rollback)
        if: matrix.board == 'pc-amd64'
        run: image/test-qemu.sh --board pc-amd64 --firmware both --update --timeout 600
      - name: QEMU boot smoke test (BIOS)
        if: matrix.board == 'pc-x86'
        run: image/test-qemu.sh --board pc-x86 --firmware bios --timeout 900
      - name: Upload serial logs
        if: always() && (matrix.board == 'pc-amd64' || matrix.board == 'pc-x86')
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-${{ matrix.board }}
          path: image/work/qemu/*.log
          if-no-files-found: ignore
      - name: Artifact name suffix
        id: names
        run: echo "incus=incus-${BOARD#lxc-}" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: phonix-${{ matrix.board }}
          # disk image + update bundle, or (lxc-*) rootfs, lxc metadata and Incus image
          path: |
            out/phonix-*-${{ matrix.board }}.img.zst
            out/phonix-*-${{ matrix.board }}.update
            out/phonix-*-${{ matrix.board }}.tar.xz
            out/phonix-*-${{ matrix.board }}.meta.tar.xz
            out/phonix-*-${{ steps.names.outputs.incus }}.tar.xz
            out/phonix-*-${{ matrix.board }}.packages
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phonix-*
          merge-multiple: true
          path: out
      - name: SHA256SUMS
        run: cd out && sha256sum phonix-*.img.zst phonix-*.update phonix-*.tar.xz > SHA256SUMS
      - name: Release notes
        run: scripts/release.sh notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            out/phonix-*.img.zst
            out/phonix-*.update
            out/phonix-*.tar.xz
            out/phonix-*.packages
            out/SHA256SUMS

  # rolling pre-release with the images of the latest default branch build
  nightly:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phonix-*
          merge-multiple: true
          path: out
      - name: SHA256SUMS
        run: cd out && sha256sum phonix-*.img.zst phonix-*.update phonix-*.tar.xz > SHA256SUMS
      - name: Publish the nightly pre-release
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-8)
          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${short} ($(date -u +%Y-%m-%d)).

          Development snapshot - not for production. Images are replaced on every push to the
          default branch. Update bundles are only accepted by systems built with the same
          signing key. The \`lxc\`/\`incus\` tarballs are system container images (Proxmox VE,
          LXC, Incus); the OCI image is
          \`ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/phonix:edge\`. See docs/INSTALL.md.
          EOF
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build ${short}" --notes-file notes.md \
            out/phonix-*.img.zst out/phonix-*.update out/phonix-*.tar.xz out/SHA256SUMS
